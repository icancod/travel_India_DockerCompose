services:
  backend:
    build:
      context: ./backend
    container_name: travel-india-backend
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: travel-india-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
